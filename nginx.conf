events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    keepalive_timeout  65;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Backend API. No trailing slash on proxy_pass, so the full
        # /api/v1/... path is forwarded unchanged to FastAPI.
        location /api/ {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 300s;
        }

        # Hashed build assets never change under the same name.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Service worker must never be served stale.
        location = /sw.js {
            expires -1;
            add_header Cache-Control "no-store, must-revalidate";
        }

        # React SPA client-side routing.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
